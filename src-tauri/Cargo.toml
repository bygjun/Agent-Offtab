[package]
name = "session-desk"
version = "0.5.22"
description = "A local inbox for Codex and Claude Code sessions"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
aes-gcm = "0.10"
base64 = "0.23"
getrandom = "0.4"
hkdf = "0.12"
p256 = { version = "0.13", default-features = false, features = ["ecdh", "std"] }
sha2 = "0.10"
subtle = "2"
chrono = { version = "0.4", default-features = false, features = ["std"] }
pulldown-cmark = { version = "0.13.6", default-features = false }
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "native-tls"] }
rusqlite = "0.40"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-notification = "2"
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
libc = "0.2"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSRunningApplication", "NSWorkspace", "NSPasteboard", "NSPasteboardItem", "libc"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["NSArray", "NSData", "NSEnumerator", "NSString", "NSURL"] }
security-framework = "3"

[profile.release]
strip = true
